name: Daily Oboe Lesson

on:
  repository_dispatch:
    types: [oboe-daily-lesson]
  workflow_dispatch:
    inputs:
      topicsJson:
        description: 'JSON array of {topic, calibrationAnswer} to test with'
        required: false
        default: '[{"topic":"basics of negotiation","calibrationAnswer":"I am a busy professional, keep it practical."}]'

jobs:
  run-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./playwright
        run: npx playwright install --with-deps chromium

      - name: Run Oboe lesson bot
        working-directory: ./playwright
        env:
          OBOE_STORAGE_STATE_B64: ${{ secrets.OBOE_STORAGE_STATE_B64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          TOPICS_JSON: ${{ github.event.client_payload.topics && toJSON(github.event.client_payload.topics) || github.event.inputs.topicsJson }}
        run: node run-lesson.js

      - name: Upload run artifacts (screenshots/logs) for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oboe-run-${{ github.run_id }}
          path: playwright/run-output/
          retention-days: 14

      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ERROR_TEXT=$(tail -c 800 playwright/run-output/run-log.txt 2>/dev/null || echo "No run-log.txt was produced — likely failed before the bot started.")
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(node -e '
              const [secret, runUrl, errorText, date] = process.argv.slice(1);
              console.log(JSON.stringify({ secret, type: "failure", runUrl, errorMessage: errorText, date }));
            ' "$WEBHOOK_SECRET" "$RUN_URL" "$ERROR_TEXT" "$(date -u +%Y-%m-%d)")"
